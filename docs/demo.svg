  <text x="24.0" y="300.5" opacity="1" xml:space="preserve"><tspan fill="#cdd6f4">│ echo │ (text: string)         │ Returns the input text unchanged. Use it to │</tspan><animate attributeName="opacity" from="0" to="1" begin="660ms" dur="180ms" fill="freeze"/></text>
